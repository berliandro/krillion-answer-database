<style>
  :root {

    --text-strong: #f7f8f5;

    --success: #9fc6a8;
    --success-line: #4a7a5c;
    --line: #343c44;

  :root {

    --line: oklch(0.38 0.014 250);
    --line-strong: oklch(0.49 0.016 250);

  /* --- Loading: one authored moment --- */
  #loader {

  .load-inner {

  #loader.done .load-inner { transform: scale(.97); }

  .spinner {
    width: 44px; height: 44px; border-radius: 50%;

  @keyframes spin { to { transform: rotate(360deg); } }
  .ready-mark {

  .spinner-wrap { position: relative; width: 44px; height: 44px; }
  #loader.ready .spinner { opacity: 0; transform: scale(.7); animation: none; }

  .load-title { font-size: 1rem; font-weight: 600; text-align: center; }

  @media (prefers-reduced-motion: reduce) {

  /* Matte finish: a very fine, non-repeating paper grain. */
  body::before {

<script>
let DATA = [];
const $ = id => document.getElementById(id);
const VIEWS = JSON.parse(document.body.dataset.views || 'null');
const CACHE = { lookup: null, vault: null };
let currentMode = document.body.dataset.mode || 'lookup';
const SITE_ROOT = new URL(
  location.pathname.replace(/\/krillion\/(?:index\.html)?$/, '/').replace(/\/index\.html$/, '/'),
  location.origin
);
const loader = $('loader'), fill = $('fill'), status = $('load-status'), title = $('load-title');
const input = $('q');

// The loader only owns the page while JS is actively fetching.
if (document.documentElement.classList.contains('js')) input.disabled = true;
if ($('retry')) $('retry').addEventListener('click', () => location.reload());

function escape(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmt(n) { return (n / 1024).toFixed(0) + ' KB'; }

function setProgress(fraction) {
  fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, fraction)) + ')';
}

/* Progressive enhancement: the generated normaliser and v2 snapshots are
 * optional. Any fetch failure falls through to the inline/legacy path. */
function loadGeneratedNorm() {
  return new Promise(resolve => {
    if (window.KrillionNorm && typeof window.KrillionNorm.norm === 'function') return resolve();
    const tag = document.createElement('script');
    tag.src = new URL('shared/norm.generated.js', SITE_ROOT);
    tag.async = true;
    tag.onload = () => resolve();
    tag.onerror = () => resolve();
    document.head.appendChild(tag);
  });
}
function hydrateSnapshot(payload) {
  if (Array.isArray(payload)) return payload;
  if (payload && Array.isArray(payload.rows)) {
    const fields = Array.isArray(payload.fields) ? payload.fields : [];
    return payload.rows.map(row => Array.isArray(row) && fields.length
      ? Object.fromEntries(fields.map((f, i) => [f, row[i]]))
      : row);
  }
  if (payload && Array.isArray(payload.data)) return payload.data;
  return null;
}
async function fetchOptionalArray(v2Url, legacyUrl) {
  try {
    const res = await fetch(new URL(v2Url, SITE_ROOT), { cache: 'no-store' });
    if (res.ok) {
      const rows = hydrateSnapshot(await res.json());
      if (rows && rows.length) return rows;
    }
  } catch (e) { /* optional fast path unavailable */ }
  const res = await fetch(new URL(legacyUrl, SITE_ROOT), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = hydrateSnapshot(await res.json());
  if (!rows) throw new Error('Bad data snapshot');
  return rows;
}

async function loadDatabase() {
  try {
    const res = await fetch(new URL('search-data.v2.json', SITE_ROOT), { cache: 'no-store' });
    if (res.ok) {
      const rows = hydrateSnapshot(await res.json());
      if (rows && rows.length) {
        setProgress(1);
        if (status) status.textContent = rows.length.toLocaleString() + ' questions ready';
        return rows;
      }
    }
  } catch (e) { /* optional fast path unavailable */ }
  const res = await fetch('search-data.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const total = Number(res.headers.get('content-length')) || 0;

  if (res.body && res.body.getReader) {
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (total) {
        setProgress(received / total);
        status.textContent = fmt(received) + ' / ' + fmt(total);
      } else {
        status.textContent = fmt(received) + ' loaded';
      }
    }
    const bytes = new Uint8Array(received);
    let pos = 0;
    for (const c of chunks) { bytes.set(c, pos); pos += c.length; }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  return await res.json();
}

/* ---- Paraphrase-tolerant matcher (mirrors scripts/paraphrase_match.py) ---- */
const STOP = new Set(('a an the any one of name give list state please can you i we me tell us some anyone '
  + 'do does did is are that which what example examples with in for to and or on at as by from this it its '
  + 'has have had be been there they them your my our would could should will shall after about like').split(' '));

const NEGATIONS = new Set(['without', 'not', 'never', 'no', 'non', 'neither']);

const SYN_GROUPS = [
  ['name','give','list','state','tell','mention','identify','cite'],
  ['famous','wellknown','notable','celebrated','renowned','popular','famed'],
  ['movie','film','motionpicture'], ['song','track','tune'],
  ['show','series','program','programme','tvshow'], ['book','novel'],
  ['character','person','hero','heroine','figure'], ['country','nation','state'],
  ['food','dish','cuisine','meal'], ['sport','game'],
  ['item','thing','object','article'], ['clothing','clothes','garment','apparel','wear'],
  ['winter','cold','snow','coldseason'], ['oneword','singleword'],
  ['threedimensional','3d'], ['follow','after','comesafter'],
  ['park','parkland','gardens'], ['author','writer','novelist'],
  ['actor','actress','performer'], ['city','town','metropolis'],
  ['animal','creature','beast'], ['plant','flower','tree'],
  ['band','group','musicalgroup'], ['album','record','lp'],
  ['team','club','squad'], ['brand','company','maker','manufacturer'],
  ['large','big','huge'], ['small','tiny','little'],
  ['old','ancient','historic'], ['new','modern','recent'],
];
const SYN = {};
for (const g of SYN_GROUPS) for (const w of g) SYN[w] = g[0];

const PHRASES = [
  ['one word','oneword'], ['single word','singleword'],
  ['well known','wellknown'], ['three dimensional','threedimensional'],
  ['motion picture','motionpicture'], ['dc comics','dccomics'],
];
const CONTRACTIONS = [
  ["you'd",'you would'], ["you're",'you are'], ["you've",'you have'],
  ["you'll",'you will'], ["it's",'it is'], ["they're",'they are'],
  ["we'd",'we would'], ["we're",'we are'], ["don't",'do not'],
  ["doesn't",'does not'], ["can't",'can not'], ["won't",'will not'],
  ["isn't",'is not'], ["wasn't",'was not'], ["i'd",'i would'],
  ["that's",'that is'], ["there's",'there is'], ["what's",'what is'],
];

function normalise(s) {
  if (window.KrillionNorm && typeof window.KrillionNorm.norm === 'function') {
    return window.KrillionNorm.norm(s);
  }
  let t = String(s).trim().toLowerCase()
    .replace(/[’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-');
  for (const [k, v] of CONTRACTIONS) t = t.replace(new RegExp('\\b' + k + '\\b', 'g'), v);
  return t.replace(/\s+/g, ' ').replace(/[?!.,:;]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function stem(w) {
  if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !/(ss|us|is)$/.test(w)) return w.slice(0, -1);

}
function canonicalToken(w) {
  w = w.replace(/[^a-z0-9]+/g, '');

}
function tokenize(s) {

  for (const [p, j] of PHRASES) t = t.replace(new RegExp('\\b' + p + '\\b', 'g'), j);
  const quoted = [...t.matchAll(/"([^"]*)"/g)].map(m => canonicalToken(m[1])).filter(Boolean);
  const rest = t.replace(/"[^"]*"/g, ' ');

  for (const w of rest.match(/[a-z0-9]+(?:-[a-z0-9]+)*/g) || []) {

}
function trigrams(s) {
  const t = '  ' + normalise(s).replace(/[^a-z0-9]+/g, ' ') + '  ';

  for (let i = 0; i + 2 < t.length; i++) g.add(t.slice(i, i + 3));

}
function dice(a, b) {
  if (!a.size || !b.size) return 0;

}
function buildIndex(data) {
  const docs = data.map(d => ({ q: d.q, a: d.a, answers: d.answers || (d.a ? [d.a] : []), norm: normalise(d.q), tok: tokenize(d.q), tri: trigrams(d.q) }));
  const N = docs.length, df = new Map(), postings = new Map();
  docs.forEach((d, i) => {
    for (const t of d.tok) {
      df.set(t, (df.get(t) || 0) + 1);
      if (!postings.has(t)) postings.set(t, []);
      postings.get(t).push(i);
    }

  const idf = new Map([...df].map(([t, n]) => [t, Math.log((N + 1) / (n + 1)) + 1]));

}
let IDX = null;  // built in init() once search-data.json has loaded
function idfOf(t) { return IDX.idf.has(t) ? IDX.idf.get(t) : IDX.def; }
function sharedWeight(qt, ct) {
  let total = 0;
  for (const t of qt) {
    if (ct.has(t)) total += idfOf(t);
    else if (t.startsWith('q:') && ct.has(t.slice(2))) total += 1.2 * idfOf(t.slice(2));
    else if (ct.has('q:' + t)) total += 1.2 * idfOf(t);

}
function search(query, limit = 10) {
  const q = normalise(query).slice(0, 200);
  if (!q) return [];
  const qtok = tokenize(q), qtri = trigrams(q);
  if (!qtok.size) {
    // CJK, RTL or emoji-only input has no Latin tokens: fall back to a
    // literal substring match so the search still degrades gracefully.
    const out = [];
    for (const d of IDX.docs) {
      if (d.norm.includes(q) || String(d.q || d.a || '').toLowerCase().includes(q)) {
        out.push({ it: d, s: 1 });
      }
    }
    return out.slice(0, limit);
  }
  let qw = 0; for (const t of qtok) qw += idfOf(t);
  const cand = new Set();
  for (const t of qtok) {
    for (const i of (IDX.postings.get(t) || [])) cand.add(i);
    if (t.startsWith('q:')) for (const i of (IDX.postings.get(t.slice(2)) || [])) cand.add(i);
    else for (const i of (IDX.postings.get('q:' + t) || [])) cand.add(i);
  }
  const indices = cand.size ? cand : IDX.docs.map((_, i) => i);
  const qNeg = [...qtok].some(t => NEGATIONS.has(t));
  const out = [];
  for (const i of indices) {
    const d = IDX.docs[i];
    if (!d.tok.size) continue;
    const sw = sharedWeight(qtok, d.tok);
    let cw = 0; for (const t of d.tok) cw += idfOf(t);
    const cov = sw / (qw || 1), pre = sw / (cw || 1);
    const overlap = cov + pre ? 2 * cov * pre / (cov + pre) : 0;
    let s = 0.88 * overlap + 0.12 * dice(qtri, d.tri);
    const dNeg = [...d.tok].some(t => NEGATIONS.has(t));
    if (qNeg !== dNeg) s *= 0.7;
    if (q === d.norm) s = 1;
    else if (d.norm.includes(q)) s = Math.max(s, 0.90);
    if (s >= 0.34) out.push({ it: d, s });
  }
  out.sort((a, b) => b.s - a.s || a.it.q.localeCompare(b.it.q));
  if (out.length) {
    const best = out[0].s, cut = Math.max(0.34, best * 0.72);

}
function matchedByMeaning(query, hits) {
  const q = normalise(query);
  return !!hits.length && !!q && !hits.some(h =>
    h.it.norm.includes(q) || q.includes(h.it.norm));
}
function render(query) {
  const q = query.trim();
  if (!q) { $('results').innerHTML = ''; $('meta').textContent = ''; return; }
  const hits = search(q, 10);
  $('meta').textContent = hits.length
    ? hits.length + ' result' + (hits.length === 1 ? '' : 's') : '';
  if (matchedByMeaning(q, hits)) {
    $('meta').insertAdjacentHTML('beforeend', ' <span class="match-note">matched by meaning</span>');
  }
  if (!hits.length) {
    $('meta').textContent = 'No results';
    $('results').innerHTML = '<div class="empty" role="status">No answer found. Try a shorter phrase — even one distinctive word will do.</div>';
    return;
  }
  $('results').innerHTML = hits.map(h => `
    <div class="card" data-answer="${escape(h.it.a)}">
      <div><div class="q">${escape(h.it.q)}</div><div class="a" role="button" tabindex="0" title="Tap to copy">${escape(h.it.a)}</div></div>
      <button class="copy-icon" type="button" aria-label="Copy answer" title="Copy answer">${COPY_SVG}</button>
    </div>`).join('');
  bindCopy($('results'));
}


const COPY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>';
const DONE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>';

async function copyAnswer(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    return ok;
  }
}

function flashCopied(row, ok) {
  row.classList.add('copied');
  const icon = row.querySelector('.copy-icon');
  if (icon) icon.innerHTML = ok ? DONE_SVG : COPY_SVG;
  const oldNote = row.querySelector('.copied-note');
  if (oldNote) oldNote.remove();
  const note = document.createElement('span');
  note.className = 'copied-note';
  note.setAttribute('role', 'status');
  note.textContent = ok ? 'Copied' : 'Copy unavailable';
  if (icon) icon.insertAdjacentElement('beforebegin', note);
  if (icon) {
    icon.setAttribute('aria-label', ok ? 'Copied' : 'Copy unavailable');
    icon.title = ok ? 'Copied' : 'Copy unavailable';
  }
  setTimeout(() => {
    row.classList.remove('copied');
    note.remove();
    if (icon) {
      icon.innerHTML = COPY_SVG;
      icon.setAttribute('aria-label', 'Copy answer');
      icon.title = 'Copy answer';
    }
  }, 1300);
}

function bindCopy(root) {
  root.querySelectorAll('[data-answer]').forEach(row => {
    const text = row.dataset.answer;
    const target = row.querySelector('.a');
    const icon = row.querySelector('.copy-icon');
    const run = async () => flashCopied(row, await copyAnswer(text));
    if (target) {
      target.addEventListener('click', () => {
        // Do not hijack a deliberate text selection.
        if (window.getSelection() && window.getSelection().toString()) return;
        run();
      });
      target.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(); }
      });
    }
    if (icon) icon.addEventListener('click', e => { e.stopPropagation(); run(); });
  });
}


let examplesController = null;
function initExamples(input, storageKey) {
  const box = document.getElementById('examples');
  if (!box) return;
  if (examplesController) examplesController.abort();
  examplesController = new AbortController();
  const signal = examplesController.signal;
  let seen = false;
  try { seen = localStorage.getItem(storageKey) === '1'; } catch (_) {}
  if (seen) box.hidden = true;
  function hide(remember) {
    box.hidden = true;
    if (remember) { try { localStorage.setItem(storageKey, '1'); } catch (_) {} }
  }
  box.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.classList.contains('examples-dismiss')) { hide(true); return; }
    const q = btn.dataset.q;
    if (!q) return;
    input.value = q;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    hide(true);
    if (matchMedia('(pointer: fine)').matches) input.focus();
  }, { signal });
  input.addEventListener('input', () => { if (input.value.trim()) hide(true); }, { once: true, signal });
}


function fail(e) {
  title.textContent = 'Answers couldn’t load';
  status.textContent = 'Check your connection, then try again.';
  $('spinner').style.display = 'none';
  $('retry').style.display = 'inline-block';
}

function examplesMarkup(v) {
  if (!v || !v.examples) return '';
  const buttons = v.examples.map(q => `<button class="example" type="button" data-q="${q}">${q}</button>`).join('');
  return '<span class="examples-label">Try:</span>' + buttons +
    '<button class="examples-dismiss" type="button" aria-label="Hide examples">Hide</button>';
}
function applyView(v) {
  document.title = v.title;
  const h1 = document.querySelector('.wrap h1');
  const sub = document.querySelector('.sub');
  if (h1) h1.innerHTML = v.h1;
  if (sub) sub.innerHTML = v.sub;
  $('examples').innerHTML = examplesMarkup(v);
  $('results').innerHTML = '';
  $('meta').textContent = '';
}
function updateSwitch() {
  const btn = $('switch');
  if (!VIEWS || !btn) return;
  btn.hidden = false;
  btn.textContent = VIEWS[currentMode].switchLabel;
}
async function ensureLookup() {
  if (CACHE.lookup) { DATA = CACHE.lookup.data; IDX = CACHE.lookup.idx; return CACHE.lookup; }
  const data = await fetchOptionalArray('search-data.v2.json', 'search-data.json');
  DATA = data; IDX = buildIndex(data);
  for (const w of ['Name a famous park', 'Name a song', 'Name a country']) search(w);
  CACHE.lookup = { data, idx: IDX, query: '' };
  return CACHE.lookup;
}
function showLookup(push = true) {
  currentMode = 'lookup';
  document.body.dataset.mode = 'lookup';
  if (VIEWS && VIEWS.lookup) applyView(VIEWS.lookup);
  if ($('count') && CACHE.lookup) $('count').textContent = CACHE.lookup.data.length.toLocaleString();
  input.value = CACHE.lookup ? CACHE.lookup.query : '';
  render(input.value);
  if (push && VIEWS) history.pushState({ view: 'lookup' }, '', new URL('./', SITE_ROOT));
  updateSwitch();
  const more = $('more');
  if (more) more.hidden = true;
}
async function switchView(target, push = true) {
  if (!VIEWS || target === currentMode) return;
  const btn = $('switch');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Switching…';
  try {
    if (target === 'vault') await ensureVault(); else await ensureLookup();
    if (target === 'vault') showVault(push); else showLookup(push);
    initExamples(input, VIEWS[target].storageKey);
  } catch (e) {
    $('meta').textContent = 'Could not switch. Check your connection and try again.';
  } finally {
    btn.disabled = false;
    updateSwitch();
  }
}
if ($('switch')) {
  if (!VIEWS) $('switch').hidden = true;
  else $('switch').addEventListener('click', () => switchView(currentMode === 'lookup' ? 'vault' : 'lookup'));
}
addEventListener('popstate', () => {
  const target = /\/krillion\/?$/.test(location.pathname) ? 'vault' : 'lookup';
  switchView(target, false);
});
input.addEventListener('input', e => {
  if (currentMode === 'local') return;
  const q = e.target.value;
  if (CACHE[currentMode]) CACHE[currentMode].query = q;
  if (currentMode === 'vault') renderVault(q); else render(q);
});
async function initLookup() {
  try {
    const cache = await ensureLookup();
    setProgress(1);
    loader.classList.add('ready');
    status.textContent = '✓ ' + cache.data.length.toLocaleString() + ' questions ready';
    status.classList.add('ready');
    title.textContent = 'Ready';
    input.disabled = false;
    initExamples(input, VIEWS ? VIEWS.lookup.storageKey : 'krillion-all-examples:v1');
    showLookup(false);
    if ($('count')) $('count').textContent = cache.data.length.toLocaleString();
    setTimeout(() => {
      loader.classList.add('done');
      fill.style.willChange = 'auto';
      if (matchMedia('(pointer: fine)').matches) input.focus();
    }, 120);
  } catch (e) {
    fail(e);
  }
}
const results = $('results');
function groupCard(g) {
  const rows = g.answers.map(a => {
    const longest = Math.max(0, ...a.split(/\s+/).map(w => w.length));
    const ch = Math.max(14, Math.min(44, Math.max(Math.round(a.length * 0.5) + 8,
      Math.round(longest * 1.1) + 10)));
    return `
    <div class="answer-row" data-answer="${escape(a)}" style="--basis:${ch}ch">
      <span class="a" role="button" tabindex="0" title="Tap to copy">${escape(a)}</span>
      <button class="copy-icon" type="button" aria-label="Copy answer" title="Copy answer">${COPY_SVG}</button>
    </div>`;
  }).join('');
  return `<section class="group"><h2 class="group-q">${escape(g.q)}</h2><div class="answers">${rows}</div></section>`;
}
function showBrowse(reset) {
  if (reset) { results.innerHTML = ''; browseShown = 0; }
  const slice = DATA.slice(browseShown, browseShown + PAGE);
  const html = slice.map(groupCard).join('');
  if (reset) {
    results.innerHTML = html;
  } else {
    const holder = document.createElement('div');
    holder.innerHTML = html;
    [...holder.children].forEach((el, i) => {
      el.classList.add('append-in');
      el.style.animationDelay = Math.min(i * 18, 108) + 'ms';
    });
    while (holder.firstChild) results.appendChild(holder.firstChild);
  }
  browseShown += slice.length;
  bindCopy(results);
  const answers = DATA.slice(0, browseShown).reduce((n, g) => n + g.answers.length, 0);
  $('meta').textContent = browseShown.toLocaleString() + ' of ' + DATA.length.toLocaleString() +
    ' questions · ' + answers.toLocaleString() + ' answers shown';
  const more = $('more');
  if (more) more.hidden = browseShown >= DATA.length;
}
function renderVault(query) {
  const q = query.trim();
  if (!q) { showBrowse(true); return; }
  const hits = search(q, 40);
  const more = $('more');
  if (more) more.hidden = true;
  if (!hits.length) {
    $('meta').textContent = 'No results';
    results.innerHTML = '<div class="empty" role="status">No 100-point answer found. Try a shorter phrase — even one distinctive word will do.</div>';
    return;
  }
  $('meta').textContent = hits.length + ' question' + (hits.length === 1 ? '' : 's') + ' matched';
  if (matchedByMeaning(q, hits)) {
    $('meta').insertAdjacentHTML('beforeend', ' <span class="match-note">matched by meaning</span>');
  }
  results.innerHTML = hits.map(h => groupCard({ q: h.it.q, answers: h.it.answers })).join('');
  bindCopy(results);
}
async function ensureVault() {
  if (CACHE.vault) { DATA = CACHE.vault.data; IDX = CACHE.vault.idx; return CACHE.vault; }
  const data = await fetchOptionalArray('krillion-data.v2.json', 'krillion/krillion-data.json');
  DATA = data; IDX = buildIndex(data);
  for (const w of ['Name a famous park', 'Name a song', 'Name a country']) search(w);
  CACHE.vault = { data, idx: IDX, query: '' };
  return CACHE.vault;
}
function showVault(push = true) {
  currentMode = 'vault';
  document.body.dataset.mode = 'vault';
  if (VIEWS && VIEWS.vault) applyView(VIEWS.vault);
  const cache = CACHE.vault;
  if ($('count')) $('count').textContent = cache.data.reduce((n, g) => n + g.answers.length, 0).toLocaleString();
  if ($('prompts')) $('prompts').textContent = cache.data.length.toLocaleString();
  input.value = cache.query;
  renderVault(input.value);
  if (push && VIEWS) history.pushState({ view: 'vault' }, '', new URL('krillion/', SITE_ROOT));
  updateSwitch();
  if ($('more')) $('more').hidden = false;
}
async function initVault() {
  try {
    await ensureVault();
    input.disabled = false;
    initExamples(input, VIEWS ? VIEWS.vault.storageKey : 'krillion-rare-examples:v1');
    showVault(false);
    if (matchMedia('(pointer: fine)').matches) input.focus();
  } catch (e) {
    $('meta').textContent = 'Could not load answers';
    results.innerHTML = '<div class="empty" role="alert">Answers couldn’t load. Check your connection, then try again.' +
      '<br><button class="more" id="retry" type="button">Try again</button></div>';
    $('retry').addEventListener('click', () => location.reload());
  }
}
const PAGE = 40;
let browseShown = 0;
if ($('more')) $('more').addEventListener('click', () => showBrowse(false));

async function init() {
  await loadGeneratedNorm();
  const mode = document.body.dataset.mode || 'lookup';
  if (mode === 'vault') return initVault();
  if (mode === 'local') { input.disabled = false; return initLocal(); }
  return initLookup();
}

init();
</script>
