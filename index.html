<html lang="en">
<head>
<meta charset="utf-8">

<title>Krillion Answer Search</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0f1a; color: #e8ecf5;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 10vh 20px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: #8b95ab; margin: 0 0 24px; font-size: .9rem; }
  input {
    width: 100%; padding: 16px 18px; font-size: 1.1rem; color: #e8ecf5;
    background: #151b2b; border: 1px solid #2a3350; border-radius: 12px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #5b7cfa; box-shadow: 0 0 0 3px #5b7cfa22; }
  .meta { color: #8b95ab; font-size: .82rem; margin: 14px 2px 10px; }
  .results { display: grid; gap: 10px; }
  .card {
    background: #151b2b; border: 1px solid #2a3350; border-radius: 12px;
    padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start;
  }
  .card .q { color: #9fb0d8; font-size: .82rem; margin-bottom: 4px; }
  .card .a { font-size: 1.05rem; font-weight: 600; }
  .copy {
    margin-left: auto; flex: none; background: #222b45; color: #cdd7f0;
    border: 1px solid #36426a; border-radius: 8px; padding: 6px 11px;
    cursor: pointer; font-size: .8rem;
  }
  .copy:hover { background: #2d3859; }
  .empty { color: #8b95ab; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Krillion Answer Search</h1>
  <p class="sub">Type a question and get the answer instantly. 193 questions indexed.</p>
  <input id="q" type="search" autocomplete="off" autofocus placeholder="Name any one famous park">

eople carry on a key ring","a":"Fire Box Key"},{"q":"Name something people carry onto a stage","a":"Tambour"},{"q":"Name something people carry up a ladder","a":"Bat Box"},{"q":"Name something people film on their phone","a":"Dot Painting"},{"q":"Name something people hand out for free","a":"Pedometer"},{"q":"Name something people have delivered to their door","a":"Sod"},{"q":"Name something people keep behind a counter","a":"Postage Meter"},{"q":"Name something people keep in its original box","a":"Wood Lathe"},{"q":"Name something people label with their name","a":"Violin Bow"},{"q":"Name something people leave on a bus","a":"Scarf Pin"},{"q":"Name something people pass around a table","a":"Paint Fan Deck"},{"q":"Name something people pry open","a":"Venus Clam"},{"q":"Name something people pull out of the ground","a":"Oca"},{"q":"Name something people read the back of","a":"Bill of Sale"},{"q":"Name something people squeeze the air out of","a":"Wet Bag"},{"q":"Name something people take apart to move it","a":"Enlarger"},{"q":"Name something people take to be repaired","a":"Bassoon"},{"q":"Name something people use to join parts","a":"Wedge Peg"},{"q":"Name something people wear around their waist","a":"Sulu"},{"q":"Name something people wind around a spool","a":"Fuel Hose"},{"q":"Name something sold in a paper wrapper","a":"Socca"},{"q":"Name something that collects water outdoors","a":"Bioswale"},{"q":"Name something that falls from a tree","a":"Gall"},{"q":"Name something that glows","a":"Tritium"},{"q":"Name something that runs but has no legs","a":"Seam"},{"q":"Name something with a face that isn't alive","a":"Anvil"},{"q":"Name something yellow","a":"Yuzu"},{"q":"Name something you can buy at a newsstand","a":"Betting Slip"},{"q":"Name something you do at a party","a":"Play Wassail"},{"q":"Name something you find in a bathroom","a":"Tabo"},{"q":"Name something you find in a purse","a":"Poem"},{"q":"Name something you find in a waiting room","a":"Ashtray"},{"q":"Name something you find in an office","a":"Bluebook"},{"q":"Name something you use to clean","a":"TSP"},{"q":"Name something you wear while sleeping","a":"Nasal Cones"},{"q":"Name something you'd find in an attic","a":"Tintype"}];
const input = document.getElementById('q');
const results = document.getElementById('results');
const meta = document.getElementById('meta');

function escape(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function score(item, q) {
  const question = item.q.toLowerCase();
  const answer = item.a.toLowerCase();
  if (question === q) return 100;
  if (question.startsWith(q)) return 80;
  const words = q.split(/\s+/).filter(Boolean);
  if (words.every(w => question.includes(w))) return 60;
  if (question.includes(q)) return 50;
  if (words.every(w => answer.includes(w))) return 30;
  if (answer.includes(q)) return 20;
  return 0;
}

function render(query) {
  const q = query.trim().toLowerCase();
  if (!q) { results.innerHTML = ''; meta.textContent = ''; return; }
  const hits = DATA.map(it => ({it, s: score(it, q)})).filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || a.it.q.localeCompare(b.it.q)).slice(0, 20);
  meta.textContent = hits.length ? hits.length + ' result' + (hits.length === 1 ? '' : 's') : '';
  if (!hits.length) {
    results.innerHTML = '<div class="empty">No matching answer in the index yet.</div>';
    return;
  }
  results.innerHTML = hits.map((h, i) => `
    <div class="card">
      <div><div class="q">${escape(h.it.q)}</div><div class="a">${escape(h.it.a)}</div></div>
      <button class="copy" data-i="${i}">Copy</button>
    </div>`).join('');
  results.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      const it = hits[Number(btn.dataset.i)].it;
      try { await navigator.clipboard.writeText(it.a); btn.textContent = 'Copied'; }
      catch (e) { btn.textContent = 'Select text'; }
      setTimeout(() => btn.textContent = 'Copy', 1200);
    });
  });
}

input.addEventListener('input', () => render(input.value));
</script>
</body>
</html>
