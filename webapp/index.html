<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krillion Answer Search</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0f1a; color: #e8ecf5;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 12vh 20px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: #8b95ab; margin: 0 0 28px; font-size: .9rem; }
  .search { position: relative; }
  input {
    width: 100%; padding: 16px 18px; font-size: 1.1rem; color: #e8ecf5;
    background: #151b2b; border: 1px solid #2a3350; border-radius: 12px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: #5b7cfa; box-shadow: 0 0 0 3px #5b7cfa22; }
  .meta { color: #8b95ab; font-size: .82rem; margin: 12px 2px 8px; min-height: 1.2em; }
  .results { display: grid; gap: 10px; }
  .card {
    background: #151b2b; border: 1px solid #2a3350; border-radius: 12px;
    padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start;
  }
  .card .q { color: #9fb0d8; font-size: .82rem; margin-bottom: 4px; }
  .card .a { font-size: 1.05rem; font-weight: 600; }
  .copy {
    margin-left: auto; flex: none; background: #222b45; color: #cdd7f0;
    border: 1px solid #36426a; border-radius: 8px; padding: 6px 11px;
    cursor: pointer; font-size: .8rem;
  }
  .copy:hover { background: #2d3859; }
  .empty { color: #8b95ab; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Krillion Answer Search</h1>
  <p class="sub">Type a question and get the answer instantly.</p>
  <div class="search">
    <input id="q" type="search" autocomplete="off" autofocus
           placeholder="Name any one famous park">
  </div>
  <div class="meta" id="meta"></div>
  <div class="results" id="results"></div>
</div>
<script>
  const input = document.getElementById('q');
  const results = document.getElementById('results');
  const meta = document.getElementById('meta');
  let timer = null, seq = 0;

  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { results.innerHTML = ''; meta.textContent = ''; return; }
    timer = setTimeout(() => run(q), 120);
  });

  async function run(q) {
    const mine = ++seq;
    meta.textContent = 'Searching…';
    try {
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      if (mine !== seq) return;
      render(data.results, q);
    } catch (e) {
      if (mine === seq) meta.textContent = 'Search unavailable.';
    }
  }

  function escape(s) {
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function render(items, q) {
    if (!items.length) {
      meta.textContent = '';
      results.innerHTML = '<div class="empty">No answers yet — the database is still being filled.</div>';
      return;
    }
    meta.textContent = items.length + ' result' + (items.length === 1 ? '' : 's');
    results.innerHTML = items.map((it, i) => `
      <div class="card">
        <div>
          <div class="q">${escape(it.question)}</div>
          <div class="a">${escape(it.answer)}</div>
        </div>
        <button class="copy" data-i="${i}">Copy</button>
      </div>`).join('');
    results.querySelectorAll('.copy').forEach(btn => {
      btn.addEventListener('click', async () => {
        const it = items[Number(btn.dataset.i)];
        try { await navigator.clipboard.writeText(it.answer); btn.textContent = 'Copied'; }
        catch (e) { btn.textContent = 'Select text'; }
        setTimeout(() => btn.textContent = 'Copy', 1200);
      });
    });
  }
</script>
</body>
</html>
